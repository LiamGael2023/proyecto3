<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Visor GIS moderno con Leaflet">
  <meta name="theme-color" content="#667eea">
  <title>GIS Viewer - Leaflet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol@0.81.1/dist/L.Control.Locate.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
          <i class="fas fa-bars"></i>
        </button>
        <div class="logo">
          <i class="fas fa-globe-americas"></i>
          <span>GIS Viewer</span>
        </div>
      </div>
      <div class="header-center">
        <div class="search-container">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Buscar ubicación..." autocomplete="off">
          <div class="search-results" id="searchResults"></div>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
          <i class="fas fa-moon"></i>
        </button>
        <button class="icon-btn" id="fullscreenToggle" aria-label="Toggle fullscreen">
          <i class="fas fa-expand"></i>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
          <!-- Layers Section -->
          <section class="sidebar-section">
            <div class="section-header">
              <i class="fas fa-layer-group"></i>
              <span>Capas Base</span>
            </div>
            <div class="section-content">
              <div class="layer-list" id="baseLayers">
                <label class="layer-item">
                  <input type="radio" name="baseLayer" value="osm" checked>
                  <span class="layer-radio"></span>
                  <span class="layer-name">OpenStreetMap</span>
                </label>
                <label class="layer-item">
                  <input type="radio" name="baseLayer" value="satellite">
                  <span class="layer-radio"></span>
                  <span class="layer-name">Satélite</span>
                </label>
                <label class="layer-item">
                  <input type="radio" name="baseLayer" value="terrain">
                  <span class="layer-radio"></span>
                  <span class="layer-name">Terreno</span>
                </label>
                <label class="layer-item">
                  <input type="radio" name="baseLayer" value="dark">
                  <span class="layer-radio"></span>
                  <span class="layer-name">Oscuro</span>
                </label>
              </div>
            </div>
          </section>

          <!-- Tools Section -->
          <section class="sidebar-section">
            <div class="section-header">
              <i class="fas fa-tools"></i>
              <span>Herramientas</span>
            </div>
            <div class="section-content">
              <div class="tools-grid">
                <button class="tool-btn" id="drawMarker" data-tooltip="Marcador">
                  <i class="fas fa-map-marker-alt"></i>
                </button>
                <button class="tool-btn" id="drawLine" data-tooltip="Línea">
                  <i class="fas fa-grip-lines"></i>
                </button>
                <button class="tool-btn" id="drawPolygon" data-tooltip="Polígono">
                  <i class="fas fa-draw-polygon"></i>
                </button>
                <button class="tool-btn" id="drawCircle" data-tooltip="Círculo">
                  <i class="far fa-circle"></i>
                </button>
                <button class="tool-btn" id="drawRectangle" data-tooltip="Rectángulo">
                  <i class="far fa-square"></i>
                </button>
                <button class="tool-btn" id="measureDistance" data-tooltip="Medir distancia">
                  <i class="fas fa-ruler"></i>
                </button>
                <button class="tool-btn" id="measureArea" data-tooltip="Medir área">
                  <i class="fas fa-vector-square"></i>
                </button>
                <button class="tool-btn danger" id="clearDrawings" data-tooltip="Limpiar">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </div>
            </div>
          </section>

          <!-- Coordinates Section -->
          <section class="sidebar-section">
            <div class="section-header">
              <i class="fas fa-crosshairs"></i>
              <span>Coordenadas</span>
            </div>
            <div class="section-content">
              <div class="coordinates-display">
                <div class="coord-item">
                  <span class="coord-label">Lat:</span>
                  <span class="coord-value" id="coordLat">--</span>
                </div>
                <div class="coord-item">
                  <span class="coord-label">Lng:</span>
                  <span class="coord-value" id="coordLng">--</span>
                </div>
              </div>
              <button class="btn-secondary" id="copyCoords">
                <i class="fas fa-copy"></i>
                Copiar coordenadas
              </button>
            </div>
          </section>

          <!-- Export Section -->
          <section class="sidebar-section">
            <div class="section-header">
              <i class="fas fa-download"></i>
              <span>Exportar</span>
            </div>
            <div class="section-content">
              <button class="btn-primary" id="exportGeoJSON">
                <i class="fas fa-file-code"></i>
                Exportar GeoJSON
              </button>
              <button class="btn-secondary" id="exportImage">
                <i class="fas fa-image"></i>
                Captura de pantalla
              </button>
            </div>
          </section>
        </div>
      </aside>

      <!-- Map Container -->
      <div class="map-wrapper">
        <div id="map"></div>

        <!-- Map Controls -->
        <div class="map-controls">
          <button class="control-btn" id="zoomIn" aria-label="Zoom in">
            <i class="fas fa-plus"></i>
          </button>
          <button class="control-btn" id="zoomOut" aria-label="Zoom out">
            <i class="fas fa-minus"></i>
          </button>
          <div class="control-divider"></div>
          <button class="control-btn" id="locateBtn" aria-label="My location">
            <i class="fas fa-location-arrow"></i>
          </button>
          <button class="control-btn" id="homeBtn" aria-label="Home">
            <i class="fas fa-home"></i>
          </button>
        </div>

        <!-- Scale Bar -->
        <div class="scale-bar" id="scaleBar"></div>

        <!-- Measurement Tooltip -->
        <div class="measurement-tooltip" id="measurementTooltip"></div>
      </div>
    </main>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <span>Cargando...</span>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
