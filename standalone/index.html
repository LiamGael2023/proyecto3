<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Visor GIS - Cyberpunk Edition">
  <meta name="theme-color" content="#ff2a6d">
  <title>GIS Viewer - Cyberpunk Edition</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Audiowide&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

  <style>
    /* ==========================================================================
       GIS VIEWER - CYBERPUNK EDITION
       Neon pink/purple theme with glitch effects
       ========================================================================== */

    :root {
      /* Cyberpunk Colors */
      --neon-pink: #ff2a6d;
      --neon-purple: #d300c5;
      --neon-blue: #05d9e8;
      --neon-yellow: #f9f002;
      --neon-green: #01ff70;
      --hot-pink: #ff6ac1;

      /* Dark backgrounds */
      --bg-dark: #0d0221;
      --bg-darker: #05010d;
      --bg-panel: rgba(13, 2, 33, 0.9);
      --bg-card: rgba(30, 10, 60, 0.8);
      --bg-hover: rgba(255, 42, 109, 0.15);

      /* Text */
      --text-primary: #ffffff;
      --text-secondary: #b8b8d1;
      --text-accent: #ff2a6d;

      /* Glows */
      --glow-pink: 0 0 10px #ff2a6d, 0 0 20px rgba(255, 42, 109, 0.5), 0 0 40px rgba(255, 42, 109, 0.3);
      --glow-purple: 0 0 10px #d300c5, 0 0 20px rgba(211, 0, 197, 0.5);
      --glow-blue: 0 0 10px #05d9e8, 0 0 20px rgba(5, 217, 232, 0.5);

      /* Typography */
      --font-display: 'Audiowide', cursive;
      --font-body: 'Rajdhani', sans-serif;

      /* Spacing */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;

      /* Layout */
      --header-height: 70px;
      --sidebar-width: 320px;
    }

    /* Base */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    body {
      font-family: var(--font-body);
      background: var(--bg-darker);
      color: var(--text-primary);
      overflow: hidden;
      position: relative;
    }

    /* Animated city grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(180deg, transparent 0%, rgba(13, 2, 33, 0.8) 100%),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 50px,
          rgba(255, 42, 109, 0.03) 50px,
          rgba(255, 42, 109, 0.03) 51px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 50px,
          rgba(5, 217, 232, 0.03) 50px,
          rgba(5, 217, 232, 0.03) 51px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* Gradient orbs */
    body::after {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(circle at 20% 80%, rgba(255, 42, 109, 0.15) 0%, transparent 25%),
        radial-gradient(circle at 80% 20%, rgba(211, 0, 197, 0.15) 0%, transparent 25%),
        radial-gradient(circle at 40% 40%, rgba(5, 217, 232, 0.1) 0%, transparent 20%);
      animation: float 20s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(2%, 2%) rotate(1deg); }
      66% { transform: translate(-1%, 1%) rotate(-1deg); }
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      position: relative;
      z-index: 1;
    }

    /* ========== HEADER ========== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--header-height);
      padding: 0 var(--space-lg);
      background: var(--bg-panel);
      border-bottom: 3px solid;
      border-image: linear-gradient(90deg, var(--neon-pink), var(--neon-purple), var(--neon-blue)) 1;
      position: relative;
      z-index: 1000;
    }

    .header::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple), var(--neon-blue));
      filter: blur(4px);
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .header-center {
      flex: 1;
      max-width: 500px;
      margin: 0 var(--space-xl);
    }

    /* Logo */
    .logo {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-family: var(--font-display);
      font-size: 1.2rem;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      position: relative;
    }
    .logo i {
      font-size: 1.6rem;
      color: var(--neon-pink);
      text-shadow: var(--glow-pink);
      -webkit-text-fill-color: var(--neon-pink);
    }
    .logo span {
      animation: glitch 3s infinite;
    }

    @keyframes glitch {
      0%, 90%, 100% { transform: translate(0); }
      92% { transform: translate(-2px, 1px); }
      94% { transform: translate(2px, -1px); }
      96% { transform: translate(-1px, -1px); }
      98% { transform: translate(1px, 1px); }
    }

    .menu-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 2px solid var(--neon-pink);
      border-radius: 8px;
      background: transparent;
      color: var(--neon-pink);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .menu-toggle:hover {
      background: var(--bg-hover);
      box-shadow: var(--glow-pink);
    }

    /* Search */
    .search-container {
      position: relative;
      width: 100%;
    }
    .search-container i {
      position: absolute;
      left: var(--space-md);
      top: 50%;
      transform: translateY(-50%);
      color: var(--neon-purple);
    }
    .search-container input {
      width: 100%;
      padding: var(--space-sm) var(--space-md);
      padding-left: 2.5rem;
      border: 2px solid var(--neon-purple);
      border-radius: 8px;
      background: rgba(13, 2, 33, 0.8);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    .search-container input:focus {
      outline: none;
      border-color: var(--neon-pink);
      box-shadow: var(--glow-pink);
    }
    .search-container input::placeholder {
      color: var(--text-secondary);
    }

    .search-results {
      position: absolute;
      top: calc(100% + var(--space-sm));
      left: 0;
      right: 0;
      background: var(--bg-panel);
      border: 2px solid var(--neon-purple);
      border-radius: 8px;
      box-shadow: var(--glow-purple);
      max-height: 300px;
      overflow-y: auto;
      display: none;
      z-index: 100;
    }
    .search-results.active { display: block; }
    .search-result-item {
      padding: var(--space-md);
      cursor: pointer;
      border-bottom: 1px solid rgba(211, 0, 197, 0.3);
      transition: all 0.2s ease;
    }
    .search-result-item:hover {
      background: var(--bg-hover);
      padding-left: var(--space-lg);
    }
    .search-result-item:last-child { border-bottom: none; }

    /* Icon Buttons */
    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 2px solid var(--neon-blue);
      border-radius: 8px;
      background: transparent;
      color: var(--neon-blue);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .icon-btn:hover {
      background: rgba(5, 217, 232, 0.15);
      box-shadow: var(--glow-blue);
      transform: scale(1.05);
    }
    .icon-btn:active { transform: scale(0.95); }

    /* ========== MAIN CONTENT ========== */
    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-panel);
      border-right: 3px solid;
      border-image: linear-gradient(180deg, var(--neon-pink), var(--neon-purple)) 1;
      overflow-y: auto;
      position: relative;
      z-index: 100;
    }

    .sidebar-content {
      padding: var(--space-lg) var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    /* Sidebar Sections */
    .sidebar-section {
      background: var(--bg-card);
      border: 2px solid rgba(211, 0, 197, 0.4);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .sidebar-section:hover {
      border-color: var(--neon-purple);
      box-shadow: 0 0 20px rgba(211, 0, 197, 0.2);
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-lg);
      background: linear-gradient(90deg, rgba(255, 42, 109, 0.3), rgba(211, 0, 197, 0.3));
      font-family: var(--font-display);
      font-size: 0.8rem;
      letter-spacing: 1px;
      color: var(--neon-pink);
      text-transform: uppercase;
    }
    .section-header i {
      font-size: 1rem;
      text-shadow: var(--glow-pink);
    }

    .section-content {
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    /* Layer List */
    .layer-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }
    .layer-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .layer-item:hover {
      background: var(--bg-hover);
      border-color: rgba(255, 42, 109, 0.3);
    }
    .layer-item input { display: none; }
    .layer-radio {
      width: 18px;
      height: 18px;
      border: 2px solid var(--text-secondary);
      border-radius: 50%;
      position: relative;
      transition: all 0.2s ease;
    }
    .layer-item input:checked + .layer-radio {
      border-color: var(--neon-pink);
      box-shadow: var(--glow-pink);
    }
    .layer-item input:checked + .layer-radio::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      background: var(--neon-pink);
      border-radius: 50%;
      box-shadow: var(--glow-pink);
    }
    .layer-name { color: var(--text-secondary); }
    .layer-item input:checked ~ .layer-name { color: var(--neon-pink); }

    /* Tools Grid */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-sm);
    }
    .tool-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      border: 2px solid rgba(5, 217, 232, 0.4);
      border-radius: 10px;
      background: rgba(5, 217, 232, 0.05);
      color: var(--neon-blue);
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
    }
    .tool-btn:hover {
      background: rgba(5, 217, 232, 0.2);
      border-color: var(--neon-blue);
      box-shadow: var(--glow-blue);
      transform: translateY(-3px);
    }
    .tool-btn:active { transform: translateY(0); }
    .tool-btn.active {
      background: rgba(255, 42, 109, 0.2);
      border-color: var(--neon-pink);
      color: var(--neon-pink);
      box-shadow: var(--glow-pink);
    }
    .tool-btn.danger:hover {
      border-color: var(--neon-yellow);
      color: var(--neon-yellow);
      box-shadow: 0 0 15px rgba(249, 240, 2, 0.5);
    }

    /* Coordinates */
    .coordinates-display {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-sm);
      padding: var(--space-md);
      background: rgba(5, 217, 232, 0.05);
      border: 1px solid rgba(5, 217, 232, 0.3);
      border-radius: 8px;
    }
    .coord-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .coord-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
    }
    .coord-value {
      font-family: var(--font-display);
      font-size: 0.85rem;
      color: var(--neon-green);
      text-shadow: 0 0 10px var(--neon-green);
    }

    /* Buttons */
    .btn-primary, .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-primary {
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
      border: none;
      color: white;
    }
    .btn-primary:hover {
      box-shadow: var(--glow-pink);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: transparent;
      border: 2px solid var(--neon-blue);
      color: var(--neon-blue);
    }
    .btn-secondary:hover {
      background: rgba(5, 217, 232, 0.15);
      box-shadow: var(--glow-blue);
    }

    /* ========== MAP CONTAINER ========== */
    .map-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      background: var(--bg-darker);
    }

    /* Vignette effect */
    .map-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      z-index: 500;
    }

    /* Corner decorations */
    .corner-decor {
      position: absolute;
      width: 80px;
      height: 80px;
      pointer-events: none;
      z-index: 500;
    }
    .corner-decor::before,
    .corner-decor::after {
      content: '';
      position: absolute;
      background: var(--neon-pink);
      box-shadow: var(--glow-pink);
    }
    .corner-decor.top-left { top: 20px; left: 20px; }
    .corner-decor.top-left::before { width: 40px; height: 3px; top: 0; left: 0; }
    .corner-decor.top-left::after { width: 3px; height: 40px; top: 0; left: 0; }

    .corner-decor.top-right { top: 20px; right: 20px; }
    .corner-decor.top-right::before { width: 40px; height: 3px; top: 0; right: 0; }
    .corner-decor.top-right::after { width: 3px; height: 40px; top: 0; right: 0; }

    .corner-decor.bottom-left { bottom: 20px; left: 20px; }
    .corner-decor.bottom-left::before { width: 40px; height: 3px; bottom: 0; left: 0; }
    .corner-decor.bottom-left::after { width: 3px; height: 40px; bottom: 0; left: 0; }

    .corner-decor.bottom-right { bottom: 20px; right: 20px; }
    .corner-decor.bottom-right::before { width: 40px; height: 3px; bottom: 0; right: 0; }
    .corner-decor.bottom-right::after { width: 3px; height: 40px; bottom: 0; right: 0; }

    /* Map Controls */
    .map-controls {
      position: absolute;
      top: var(--space-lg);
      right: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      background: var(--bg-panel);
      border: 2px solid var(--neon-purple);
      border-radius: 12px;
      padding: var(--space-sm);
      box-shadow: var(--glow-purple);
      z-index: 1000;
    }
    .control-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255, 42, 109, 0.3);
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .control-btn:hover {
      background: var(--bg-hover);
      border-color: var(--neon-pink);
      color: var(--neon-pink);
      box-shadow: var(--glow-pink);
    }
    .control-btn:active { transform: scale(0.9); }
    .control-divider {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-purple), transparent);
      margin: var(--space-xs) 0;
    }

    /* Stats Panel */
    .stats-panel {
      position: absolute;
      bottom: var(--space-lg);
      left: var(--space-lg);
      background: var(--bg-panel);
      border: 2px solid var(--neon-blue);
      border-radius: 12px;
      padding: var(--space-md);
      min-width: 180px;
      z-index: 1000;
    }
    .stats-title {
      font-family: var(--font-display);
      font-size: 0.65rem;
      letter-spacing: 2px;
      color: var(--neon-blue);
      margin-bottom: var(--space-sm);
      text-transform: uppercase;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: var(--space-xs) 0;
      font-size: 0.8rem;
    }
    .stat-label { color: var(--text-secondary); }
    .stat-value {
      color: var(--neon-green);
      font-weight: 600;
      text-shadow: 0 0 5px var(--neon-green);
    }

    /* ========== TOAST NOTIFICATIONS ========== */
    .toast-container {
      position: fixed;
      top: calc(var(--header-height) + var(--space-md));
      right: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      z-index: 9999;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md) var(--space-lg);
      background: var(--bg-panel);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      animation: slideInRight 0.3s ease;
      max-width: 350px;
      border-left: 4px solid;
    }
    .toast.success { border-color: var(--neon-green); }
    .toast.error { border-color: var(--neon-pink); }
    .toast.info { border-color: var(--neon-blue); }
    .toast.warning { border-color: var(--neon-yellow); }
    .toast-icon { font-size: 1.3rem; }
    .toast.success .toast-icon { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
    .toast.error .toast-icon { color: var(--neon-pink); text-shadow: var(--glow-pink); }
    .toast.info .toast-icon { color: var(--neon-blue); text-shadow: var(--glow-blue); }
    .toast.warning .toast-icon { color: var(--neon-yellow); }
    .toast-content { flex: 1; }
    .toast-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 1px;
      margin-bottom: var(--space-xs);
    }
    .toast-message { color: var(--text-secondary); font-size: 0.8rem; }
    .toast-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: var(--space-xs);
      transition: color 0.2s;
    }
    .toast-close:hover { color: var(--neon-pink); }

    /* ========== LOADING OVERLAY ========== */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 1, 13, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-lg);
      z-index: 99999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .loading-overlay.active { opacity: 1; visibility: visible; }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 42, 109, 0.2);
      border-top-color: var(--neon-pink);
      border-right-color: var(--neon-purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      box-shadow: var(--glow-pink);
    }
    .loading-text {
      font-family: var(--font-display);
      font-size: 0.9rem;
      letter-spacing: 3px;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple), var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse 1.5s ease-in-out infinite;
    }

    /* ========== LEAFLET CUSTOM ========== */
    .leaflet-container { font-family: var(--font-body); background: var(--bg-darker); }
    .leaflet-control-attribution {
      background: var(--bg-panel) !important;
      color: var(--text-secondary) !important;
      font-size: 0.65rem !important;
    }
    .leaflet-control-attribution a { color: var(--neon-purple) !important; }
    .leaflet-popup-content-wrapper {
      background: var(--bg-panel);
      border: 2px solid var(--neon-pink);
      border-radius: 12px;
      box-shadow: var(--glow-pink);
    }
    .leaflet-popup-content {
      margin: var(--space-md);
      color: var(--text-primary);
      font-size: 0.85rem;
    }
    .leaflet-popup-tip {
      background: var(--bg-panel);
      border: 2px solid var(--neon-pink);
      box-shadow: var(--glow-pink);
    }
    .leaflet-control-zoom { display: none !important; }
    .leaflet-control-scale-line {
      background: var(--bg-panel) !important;
      border-color: var(--neon-purple) !important;
      color: var(--text-primary) !important;
    }

    /* ========== ANIMATIONS ========== */
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(100%); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 1024px) {
      .sidebar {
        position: absolute;
        left: 0;
        top: var(--header-height);
        height: calc(100vh - var(--header-height));
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .menu-toggle { display: flex; }
      .header-center { display: none; }
    }

    @media (max-width: 768px) {
      :root { --sidebar-width: 100%; --header-height: 60px; }
      .logo span { display: none; }
      .map-controls { top: var(--space-md); right: var(--space-md); }
      .stats-panel { display: none; }
      .corner-decor { display: none; }
    }

    /* ========== SCROLLBAR ========== */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-darker); }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--neon-pink), var(--neon-purple));
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      box-shadow: var(--glow-pink);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
          <i class="fas fa-bars"></i>
        </button>
        <div class="logo">
          <i class="fas fa-map-marked-alt"></i>
          <span>NEOMAPS</span>
        </div>
      </div>
      <div class="header-center">
        <div class="search-container">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search location..." autocomplete="off">
          <div class="search-results" id="searchResults"></div>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="fullscreenToggle" aria-label="Toggle fullscreen">
          <i class="fas fa-expand"></i>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
          <!-- Layers Section -->
          <section class="sidebar-section">
            <div class="section-header">
              <i class="fas fa-layer-group"></i>
              <span>Base Maps</span>
            </div>
            <div class="section-content">
              <div class="layer-list" id="baseLayers">
                <label class="layer-item">
                  <input type="radio" name="baseLayer" value="osm" checked>
                  <span class="layer-radio"></span>
                  <span class="layer-name">Street Map</span>
                </label>
                <label class="layer-item">
                  <input type="radio" name="baseLayer" value="satellite">
                  <span class="layer-radio"></span>
                  <span class="layer-name">Satellite</span>
                </label>
                <label class="layer-item">
                  <input type="radio" name="baseLayer" value="terrain">
                  <span class="layer-radio"></span>
                  <span class="layer-name">Terrain</span>
                </label>
                <label class="layer-item">
                  <input type="radio" name="baseLayer" value="dark">
                  <span class="layer-radio"></span>
                  <span class="layer-name">Dark Mode</span>
                </label>
              </div>
            </div>
          </section>

          <!-- Tools Section -->
          <section class="sidebar-section">
            <div class="section-header">
              <i class="fas fa-pen-fancy"></i>
              <span>Draw Tools</span>
            </div>
            <div class="section-content">
              <div class="tools-grid">
                <button class="tool-btn" id="drawMarker" title="Marker">
                  <i class="fas fa-map-marker-alt"></i>
                </button>
                <button class="tool-btn" id="drawLine" title="Line">
                  <i class="fas fa-grip-lines"></i>
                </button>
                <button class="tool-btn" id="drawPolygon" title="Polygon">
                  <i class="fas fa-draw-polygon"></i>
                </button>
                <button class="tool-btn" id="drawCircle" title="Circle">
                  <i class="far fa-circle"></i>
                </button>
                <button class="tool-btn" id="drawRectangle" title="Rectangle">
                  <i class="far fa-square"></i>
                </button>
                <button class="tool-btn" id="measureDistance" title="Measure">
                  <i class="fas fa-ruler"></i>
                </button>
                <button class="tool-btn" id="measureArea" title="Area">
                  <i class="fas fa-vector-square"></i>
                </button>
                <button class="tool-btn danger" id="clearDrawings" title="Clear">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </div>
            </div>
          </section>

          <!-- Coordinates Section -->
          <section class="sidebar-section">
            <div class="section-header">
              <i class="fas fa-crosshairs"></i>
              <span>Coordinates</span>
            </div>
            <div class="section-content">
              <div class="coordinates-display">
                <div class="coord-item">
                  <span class="coord-label">Lat</span>
                  <span class="coord-value" id="coordLat">--</span>
                </div>
                <div class="coord-item">
                  <span class="coord-label">Lng</span>
                  <span class="coord-value" id="coordLng">--</span>
                </div>
              </div>
              <button class="btn-secondary" id="copyCoords">
                <i class="fas fa-copy"></i>
                Copy
              </button>
            </div>
          </section>

          <!-- Export Section -->
          <section class="sidebar-section">
            <div class="section-header">
              <i class="fas fa-file-export"></i>
              <span>Export</span>
            </div>
            <div class="section-content">
              <button class="btn-primary" id="exportGeoJSON">
                <i class="fas fa-download"></i>
                Download GeoJSON
              </button>
            </div>
          </section>
        </div>
      </aside>

      <!-- Map Container -->
      <div class="map-wrapper">
        <div class="corner-decor top-left"></div>
        <div class="corner-decor top-right"></div>
        <div class="corner-decor bottom-left"></div>
        <div class="corner-decor bottom-right"></div>

        <div id="map"></div>

        <!-- Map Controls -->
        <div class="map-controls">
          <button class="control-btn" id="zoomIn" aria-label="Zoom in">
            <i class="fas fa-plus"></i>
          </button>
          <button class="control-btn" id="zoomOut" aria-label="Zoom out">
            <i class="fas fa-minus"></i>
          </button>
          <div class="control-divider"></div>
          <button class="control-btn" id="locateBtn" aria-label="My location">
            <i class="fas fa-location-arrow"></i>
          </button>
          <button class="control-btn" id="homeBtn" aria-label="Home">
            <i class="fas fa-home"></i>
          </button>
        </div>

        <!-- Stats Panel -->
        <div class="stats-panel">
          <div class="stats-title">Map Info</div>
          <div class="stat-row">
            <span class="stat-label">Zoom</span>
            <span class="stat-value" id="zoomLevel">6</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Objects</span>
            <span class="stat-value" id="objectCount">0</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <span class="loading-text">LOADING...</span>
    </div>
  </div>

  <script>
    // Configuration
    const CONFIG = {
      defaultCenter: [40.416775, -3.703790],
      defaultZoom: 6,
      minZoom: 2,
      maxZoom: 19,
      baseLayers: {
        osm: {
          name: 'Street Map',
          url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
          attribution: '&copy; OpenStreetMap'
        },
        satellite: {
          name: 'Satellite',
          url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
          attribution: '&copy; Esri'
        },
        terrain: {
          name: 'Terrain',
          url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
          attribution: '&copy; OpenTopoMap'
        },
        dark: {
          name: 'Dark Mode',
          url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
          attribution: '&copy; CARTO'
        }
      }
    };

    // State
    const state = {
      map: null,
      currentBaseLayer: null,
      baseLayers: {},
      drawnItems: null,
      currentDrawTool: null,
      sidebarOpen: true
    };

    // Initialize
    document.addEventListener('DOMContentLoaded', init);

    function init() {
      initMap();
      initBaseLayers();
      initDrawLayer();
      initEventListeners();
      initCoordinates();
      hideLoading();
      showToast('success', 'Welcome', 'NeoMaps loaded successfully');
    }

    // Map
    function initMap() {
      state.map = L.map('map', {
        center: CONFIG.defaultCenter,
        zoom: CONFIG.defaultZoom,
        minZoom: CONFIG.minZoom,
        maxZoom: CONFIG.maxZoom,
        zoomControl: false
      });

      L.control.scale({ position: 'bottomright', metric: true, imperial: false }).addTo(state.map);

      state.map.on('zoomend', () => {
        document.getElementById('zoomLevel').textContent = state.map.getZoom();
      });
    }

    // Base Layers
    function initBaseLayers() {
      Object.entries(CONFIG.baseLayers).forEach(([key, config]) => {
        state.baseLayers[key] = L.tileLayer(config.url, {
          attribution: config.attribution,
          maxZoom: CONFIG.maxZoom
        });
      });

      state.baseLayers.osm.addTo(state.map);
      state.currentBaseLayer = 'osm';

      document.querySelectorAll('input[name="baseLayer"]').forEach(input => {
        input.addEventListener('change', (e) => switchBaseLayer(e.target.value));
      });
    }

    function switchBaseLayer(layerKey) {
      if (state.currentBaseLayer === layerKey) return;
      if (state.baseLayers[state.currentBaseLayer]) {
        state.map.removeLayer(state.baseLayers[state.currentBaseLayer]);
      }
      state.baseLayers[layerKey].addTo(state.map);
      state.currentBaseLayer = layerKey;
      showToast('info', 'Layer Changed', CONFIG.baseLayers[layerKey].name + ' active');
    }

    // Drawing
    function initDrawLayer() {
      state.drawnItems = new L.FeatureGroup();
      state.map.addLayer(state.drawnItems);

      state.map.on(L.Draw.Event.CREATED, (e) => {
        const layer = e.layer;

        if (e.layerType === 'marker') {
          const latlng = layer.getLatLng();
          layer.bindPopup('<strong>Marker</strong><br>Lat: ' + latlng.lat.toFixed(6) + '<br>Lng: ' + latlng.lng.toFixed(6));
        } else if (e.layerType === 'polyline') {
          const distance = calculateDistance(layer);
          layer.bindPopup('<strong>Line</strong><br>Distance: ' + formatDistance(distance));
        } else if (e.layerType === 'polygon' || e.layerType === 'rectangle') {
          const area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
          layer.bindPopup('<strong>' + e.layerType + '</strong><br>Area: ' + formatArea(area));
        } else if (e.layerType === 'circle') {
          const radius = layer.getRadius();
          const area = Math.PI * radius * radius;
          layer.bindPopup('<strong>Circle</strong><br>Radius: ' + formatDistance(radius) + '<br>Area: ' + formatArea(area));
        }

        state.drawnItems.addLayer(layer);
        updateObjectCount();
        showToast('success', 'Created', e.layerType + ' added');
      });
    }

    function updateObjectCount() {
      document.getElementById('objectCount').textContent = state.drawnItems.getLayers().length;
    }

    function startDrawing(type) {
      if (state.currentDrawTool) state.currentDrawTool.disable();

      let handler;
      const opts = { color: '#ff2a6d', fillColor: '#ff2a6d', fillOpacity: 0.2, weight: 3 };

      switch (type) {
        case 'marker': handler = new L.Draw.Marker(state.map); break;
        case 'polyline': handler = new L.Draw.Polyline(state.map, { shapeOptions: opts }); break;
        case 'polygon': handler = new L.Draw.Polygon(state.map, { shapeOptions: opts }); break;
        case 'circle': handler = new L.Draw.Circle(state.map, { shapeOptions: opts }); break;
        case 'rectangle': handler = new L.Draw.Rectangle(state.map, { shapeOptions: opts }); break;
      }

      if (handler) {
        handler.enable();
        state.currentDrawTool = handler;
        updateToolButtons(type);
      }
    }

    function updateToolButtons(activeType) {
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
      const map = { marker: 'drawMarker', polyline: 'drawLine', polygon: 'drawPolygon', circle: 'drawCircle', rectangle: 'drawRectangle' };
      if (map[activeType]) document.getElementById(map[activeType])?.classList.add('active');
    }

    function clearDrawings() {
      state.drawnItems.clearLayers();
      updateObjectCount();
      showToast('info', 'Cleared', 'All objects removed');
    }

    // Measurements
    function calculateDistance(layer) {
      const latlngs = layer.getLatLngs();
      let distance = 0;
      for (let i = 0; i < latlngs.length - 1; i++) {
        distance += latlngs[i].distanceTo(latlngs[i + 1]);
      }
      return distance;
    }

    function formatDistance(meters) {
      return meters >= 1000 ? (meters / 1000).toFixed(2) + ' km' : meters.toFixed(2) + ' m';
    }

    function formatArea(sqMeters) {
      if (sqMeters >= 1000000) return (sqMeters / 1000000).toFixed(2) + ' km²';
      if (sqMeters >= 10000) return (sqMeters / 10000).toFixed(2) + ' ha';
      return sqMeters.toFixed(2) + ' m²';
    }

    // Coordinates
    function initCoordinates() {
      state.map.on('mousemove', (e) => {
        document.getElementById('coordLat').textContent = e.latlng.lat.toFixed(6);
        document.getElementById('coordLng').textContent = e.latlng.lng.toFixed(6);
      });
    }

    function copyCoordinates() {
      const lat = document.getElementById('coordLat').textContent;
      const lng = document.getElementById('coordLng').textContent;
      if (lat === '--') {
        showToast('warning', 'No Data', 'Move cursor over map');
        return;
      }
      navigator.clipboard.writeText(lat + ', ' + lng).then(() => {
        showToast('success', 'Copied', 'Coordinates copied');
      });
    }

    // Geolocation
    function locateUser() {
      showLoading();
      state.map.locate({ setView: true, maxZoom: 16 });

      state.map.once('locationfound', (e) => {
        hideLoading();
        L.marker(e.latlng).addTo(state.drawnItems)
          .bindPopup('<strong>Your Location</strong><br>Accuracy: ' + formatDistance(e.accuracy)).openPopup();
        L.circle(e.latlng, { radius: e.accuracy, color: '#ff2a6d', fillOpacity: 0.1 }).addTo(state.drawnItems);
        updateObjectCount();
        showToast('success', 'Found', 'Location acquired');
      });

      state.map.once('locationerror', (e) => {
        hideLoading();
        showToast('error', 'Error', e.message);
      });
    }

    // Search
    let searchTimeout;
    async function searchLocation(query) {
      if (!query || query.length < 3) {
        hideSearchResults();
        return;
      }
      try {
        const response = await fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query) + '&limit=5');
        const results = await response.json();
        if (results.length > 0) showSearchResults(results);
        else hideSearchResults();
      } catch (error) {
        showToast('error', 'Error', 'Search failed');
      }
    }

    function showSearchResults(results) {
      const container = document.getElementById('searchResults');
      container.innerHTML = results.map(r =>
        '<div class="search-result-item" data-lat="' + r.lat + '" data-lon="' + r.lon + '">' +
        '<i class="fas fa-map-pin" style="color:var(--neon-pink);margin-right:8px"></i>' + r.display_name + '</div>'
      ).join('');
      container.classList.add('active');

      container.querySelectorAll('.search-result-item').forEach(item => {
        item.addEventListener('click', () => {
          state.map.setView([parseFloat(item.dataset.lat), parseFloat(item.dataset.lon)], 15);
          L.marker([parseFloat(item.dataset.lat), parseFloat(item.dataset.lon)])
            .addTo(state.drawnItems).bindPopup(item.textContent.trim()).openPopup();
          updateObjectCount();
          hideSearchResults();
          document.getElementById('searchInput').value = '';
        });
      });
    }

    function hideSearchResults() {
      document.getElementById('searchResults').classList.remove('active');
    }

    // Export
    function exportGeoJSON() {
      const data = state.drawnItems.toGeoJSON();
      if (data.features.length === 0) {
        showToast('warning', 'Empty', 'No objects to export');
        return;
      }
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'neomaps-' + new Date().toISOString().slice(0, 10) + '.geojson';
      a.click();
      showToast('success', 'Exported', 'File downloaded');
    }

    // UI
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }

    // Toast
    function showToast(type, title, message) {
      const container = document.getElementById('toastContainer');
      const icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
      const toast = document.createElement('div');
      toast.className = 'toast ' + type;
      toast.innerHTML = '<i class="fas ' + icons[type] + ' toast-icon"></i>' +
        '<div class="toast-content"><div class="toast-title">' + title + '</div><div class="toast-message">' + message + '</div></div>' +
        '<button class="toast-close"><i class="fas fa-times"></i></button>';
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 5000);
      toast.querySelector('.toast-close').addEventListener('click', () => toast.remove());
    }

    // Loading
    function showLoading() { document.getElementById('loadingOverlay').classList.add('active'); }
    function hideLoading() { document.getElementById('loadingOverlay').classList.remove('active'); }

    // Event Listeners
    function initEventListeners() {
      document.getElementById('fullscreenToggle')?.addEventListener('click', toggleFullscreen);
      document.getElementById('menuToggle')?.addEventListener('click', toggleSidebar);
      document.getElementById('zoomIn')?.addEventListener('click', () => state.map.zoomIn());
      document.getElementById('zoomOut')?.addEventListener('click', () => state.map.zoomOut());
      document.getElementById('homeBtn')?.addEventListener('click', () => state.map.setView(CONFIG.defaultCenter, CONFIG.defaultZoom));
      document.getElementById('locateBtn')?.addEventListener('click', locateUser);
      document.getElementById('drawMarker')?.addEventListener('click', () => startDrawing('marker'));
      document.getElementById('drawLine')?.addEventListener('click', () => startDrawing('polyline'));
      document.getElementById('drawPolygon')?.addEventListener('click', () => startDrawing('polygon'));
      document.getElementById('drawCircle')?.addEventListener('click', () => startDrawing('circle'));
      document.getElementById('drawRectangle')?.addEventListener('click', () => startDrawing('rectangle'));
      document.getElementById('measureDistance')?.addEventListener('click', () => { startDrawing('polyline'); showToast('info', 'Measure', 'Draw a line'); });
      document.getElementById('measureArea')?.addEventListener('click', () => { startDrawing('polygon'); showToast('info', 'Measure', 'Draw a polygon'); });
      document.getElementById('clearDrawings')?.addEventListener('click', clearDrawings);
      document.getElementById('copyCoords')?.addEventListener('click', copyCoordinates);
      document.getElementById('exportGeoJSON')?.addEventListener('click', exportGeoJSON);

      const searchInput = document.getElementById('searchInput');
      searchInput?.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => searchLocation(e.target.value), 500);
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-container')) hideSearchResults();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && state.currentDrawTool) {
          state.currentDrawTool.disable();
          state.currentDrawTool = null;
          updateToolButtons(null);
        }
      });

      window.addEventListener('resize', () => state.map.invalidateSize());
    }
  </script>
</body>
</html>
