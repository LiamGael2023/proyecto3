<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Visor GIS - Spaceship Command Center">
  <meta name="theme-color" content="#00f5ff">
  <title>GIS Command Center - Orbital View</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

  <style>
    /* ==========================================================================
       GIS COMMAND CENTER - SPACESHIP HUD THEME
       ========================================================================== */

    :root {
      /* Spaceship Colors */
      --neon-cyan: #00f5ff;
      --neon-blue: #00a8ff;
      --neon-purple: #bf00ff;
      --neon-pink: #ff00ff;
      --neon-green: #00ff88;
      --neon-orange: #ff6600;
      --neon-red: #ff0044;
      --neon-yellow: #ffff00;

      /* Backgrounds */
      --bg-space: #000810;
      --bg-panel: rgba(0, 20, 40, 0.85);
      --bg-panel-solid: rgba(0, 30, 60, 0.95);
      --bg-hover: rgba(0, 245, 255, 0.1);

      /* Text */
      --text-primary: #00f5ff;
      --text-secondary: #00a8ff;
      --text-dim: #4a7c99;
      --text-white: #ffffff;

      /* Borders & Glows */
      --border-glow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 245, 255, 0.3);
      --border-glow-strong: 0 0 15px var(--neon-cyan), 0 0 30px rgba(0, 245, 255, 0.5), 0 0 45px rgba(0, 245, 255, 0.3);
      --text-glow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 245, 255, 0.5);

      /* Typography */
      --font-display: 'Orbitron', monospace;
      --font-mono: 'Share Tech Mono', monospace;

      /* Spacing */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;

      /* Layout */
      --header-height: 70px;
      --sidebar-width: 340px;
    }

    /* Base */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; }

    body {
      font-family: var(--font-mono);
      background: var(--bg-space);
      color: var(--text-primary);
      overflow: hidden;
      position: relative;
    }

    /* Animated Background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(0, 50, 100, 0.3) 0%, transparent 70%),
        linear-gradient(0deg, transparent 24%, rgba(0, 245, 255, 0.03) 25%, rgba(0, 245, 255, 0.03) 26%, transparent 27%, transparent 74%, rgba(0, 245, 255, 0.03) 75%, rgba(0, 245, 255, 0.03) 76%, transparent 77%, transparent),
        linear-gradient(90deg, transparent 24%, rgba(0, 245, 255, 0.03) 25%, rgba(0, 245, 255, 0.03) 26%, transparent 27%, transparent 74%, rgba(0, 245, 255, 0.03) 75%, rgba(0, 245, 255, 0.03) 76%, transparent 77%, transparent);
      background-size: 100% 100%, 50px 50px, 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      position: relative;
      z-index: 1;
    }

    /* ========== HEADER / COMMAND BAR ========== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--header-height);
      padding: 0 var(--space-lg);
      background: var(--bg-panel);
      border-bottom: 2px solid var(--neon-cyan);
      box-shadow: var(--border-glow), inset 0 -20px 60px rgba(0, 245, 255, 0.05);
      position: relative;
      z-index: 1000;
    }

    .header::before,
    .header::after {
      content: '';
      position: absolute;
      bottom: -2px;
      width: 100px;
      height: 2px;
      background: var(--neon-cyan);
      box-shadow: var(--border-glow-strong);
    }
    .header::before { left: 0; }
    .header::after { right: 0; }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .header-center {
      flex: 1;
      max-width: 500px;
      margin: 0 var(--space-xl);
    }

    /* Logo */
    .logo {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--neon-cyan);
      text-shadow: var(--text-glow);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .logo i {
      font-size: 1.8rem;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .menu-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 1px solid var(--neon-cyan);
      border-radius: 4px;
      background: transparent;
      color: var(--neon-cyan);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .menu-toggle:hover {
      background: var(--bg-hover);
      box-shadow: var(--border-glow);
    }

    /* Search */
    .search-container {
      position: relative;
      width: 100%;
    }
    .search-container i {
      position: absolute;
      left: var(--space-md);
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 0.875rem;
    }
    .search-container input {
      width: 100%;
      padding: var(--space-sm) var(--space-md);
      padding-left: 2.5rem;
      border: 1px solid var(--neon-cyan);
      border-radius: 4px;
      background: rgba(0, 20, 40, 0.8);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      transition: all 0.3s ease;
    }
    .search-container input:focus {
      outline: none;
      box-shadow: var(--border-glow);
      background: rgba(0, 30, 60, 0.9);
    }
    .search-container input::placeholder {
      color: var(--text-dim);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 1px;
    }

    .search-results {
      position: absolute;
      top: calc(100% + var(--space-sm));
      left: 0;
      right: 0;
      background: var(--bg-panel-solid);
      border: 1px solid var(--neon-cyan);
      border-radius: 4px;
      box-shadow: var(--border-glow);
      max-height: 300px;
      overflow-y: auto;
      display: none;
      z-index: 100;
    }
    .search-results.active { display: block; }
    .search-result-item {
      padding: var(--space-md);
      cursor: pointer;
      border-bottom: 1px solid rgba(0, 245, 255, 0.2);
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }
    .search-result-item:hover {
      background: var(--bg-hover);
      padding-left: var(--space-lg);
    }
    .search-result-item:last-child { border-bottom: none; }

    /* Icon Buttons */
    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 1px solid var(--neon-cyan);
      border-radius: 4px;
      background: transparent;
      color: var(--neon-cyan);
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }
    .icon-btn::before {
      content: '';
      position: absolute;
      inset: 2px;
      border: 1px solid rgba(0, 245, 255, 0.3);
      border-radius: 2px;
      pointer-events: none;
    }
    .icon-btn:hover {
      background: var(--bg-hover);
      box-shadow: var(--border-glow);
      transform: scale(1.05);
    }
    .icon-btn:active { transform: scale(0.95); }

    /* Status indicator */
    .status-indicator {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-xs) var(--space-md);
      border: 1px solid var(--neon-green);
      border-radius: 4px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--neon-green);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--neon-green);
      border-radius: 50%;
      animation: pulse-glow 1.5s ease-in-out infinite;
      box-shadow: 0 0 10px var(--neon-green);
    }

    /* ========== MAIN CONTENT ========== */
    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ========== SIDEBAR / CONTROL PANEL ========== */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-panel);
      border-right: 2px solid var(--neon-cyan);
      box-shadow: var(--border-glow);
      overflow-y: auto;
      position: relative;
      z-index: 100;
    }

    .sidebar::before {
      content: 'CONTROL PANEL';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: var(--space-sm);
      background: rgba(0, 245, 255, 0.1);
      border-bottom: 1px solid var(--neon-cyan);
      font-family: var(--font-display);
      font-size: 0.65rem;
      text-align: center;
      letter-spacing: 3px;
      color: var(--neon-cyan);
    }

    .sidebar-content {
      padding: var(--space-xl) var(--space-md) var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    /* Sidebar Sections */
    .sidebar-section {
      background: rgba(0, 30, 60, 0.5);
      border: 1px solid rgba(0, 245, 255, 0.3);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .sidebar-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      padding-left: var(--space-lg);
      background: rgba(0, 245, 255, 0.1);
      border-bottom: 1px solid rgba(0, 245, 255, 0.2);
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--neon-cyan);
    }
    .section-header i { font-size: 0.9rem; }

    .section-content {
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    /* Layer List */
    .layer-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }
    .layer-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.8rem;
    }
    .layer-item:hover {
      background: var(--bg-hover);
      border-color: rgba(0, 245, 255, 0.3);
    }
    .layer-item input { display: none; }
    .layer-radio {
      width: 16px;
      height: 16px;
      border: 2px solid var(--text-dim);
      border-radius: 50%;
      position: relative;
      transition: all 0.2s ease;
    }
    .layer-item input:checked + .layer-radio {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
    }
    .layer-item input:checked + .layer-radio::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      background: var(--neon-cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--neon-cyan);
    }
    .layer-name { color: var(--text-secondary); }
    .layer-item input:checked ~ .layer-name { color: var(--neon-cyan); }

    /* Tools Grid */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-sm);
    }
    .tool-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      border: 1px solid rgba(0, 245, 255, 0.3);
      border-radius: 4px;
      background: rgba(0, 20, 40, 0.5);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .tool-btn:hover {
      background: var(--bg-hover);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: var(--border-glow);
      transform: translateY(-2px);
    }
    .tool-btn:active { transform: translateY(0); }
    .tool-btn.active {
      background: rgba(0, 245, 255, 0.2);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: var(--border-glow);
    }
    .tool-btn.danger:hover {
      border-color: var(--neon-red);
      color: var(--neon-red);
      box-shadow: 0 0 10px var(--neon-red);
    }

    /* Coordinates */
    .coordinates-display {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      padding: var(--space-sm);
      background: rgba(0, 20, 40, 0.8);
      border: 1px solid rgba(0, 245, 255, 0.2);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
    }
    .coord-item {
      display: flex;
      justify-content: space-between;
    }
    .coord-label {
      color: var(--text-dim);
      text-transform: uppercase;
      font-size: 0.65rem;
      letter-spacing: 1px;
    }
    .coord-value {
      color: var(--neon-green);
      font-weight: 500;
      text-shadow: 0 0 5px var(--neon-green);
    }

    /* Buttons */
    .btn-primary, .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-primary {
      background: rgba(0, 245, 255, 0.2);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
    }
    .btn-primary:hover {
      background: rgba(0, 245, 255, 0.3);
      box-shadow: var(--border-glow);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(0, 245, 255, 0.3);
      color: var(--text-secondary);
    }
    .btn-secondary:hover {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      background: var(--bg-hover);
    }

    /* ========== MAP CONTAINER ========== */
    .map-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      background: var(--bg-space);
    }

    /* HUD Overlay Corners */
    .map-wrapper::before,
    .map-wrapper::after {
      content: '';
      position: absolute;
      width: 100px;
      height: 100px;
      border: 2px solid var(--neon-cyan);
      pointer-events: none;
      z-index: 500;
      opacity: 0.5;
    }
    .map-wrapper::before {
      top: var(--space-md);
      left: var(--space-md);
      border-right: none;
      border-bottom: none;
    }
    .map-wrapper::after {
      bottom: var(--space-md);
      right: var(--space-md);
      border-left: none;
      border-top: none;
    }

    /* Scanning Line Animation */
    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
      box-shadow: 0 0 20px var(--neon-cyan);
      animation: scan 4s linear infinite;
      pointer-events: none;
      z-index: 600;
      opacity: 0.3;
    }

    /* Crosshair */
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      pointer-events: none;
      z-index: 500;
    }
    .crosshair::before,
    .crosshair::after {
      content: '';
      position: absolute;
      background: var(--neon-cyan);
      opacity: 0.5;
    }
    .crosshair::before {
      width: 2px;
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
    }
    .crosshair::after {
      height: 2px;
      width: 100%;
      top: 50%;
      transform: translateY(-50%);
    }

    /* Map Controls */
    .map-controls {
      position: absolute;
      top: var(--space-lg);
      right: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      background: var(--bg-panel);
      border: 1px solid var(--neon-cyan);
      border-radius: 4px;
      padding: var(--space-sm);
      box-shadow: var(--border-glow);
      z-index: 1000;
    }
    .control-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(0, 245, 255, 0.3);
      border-radius: 4px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .control-btn:hover {
      background: var(--bg-hover);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: var(--border-glow);
    }
    .control-btn:active { transform: scale(0.9); }
    .control-divider {
      height: 1px;
      background: rgba(0, 245, 255, 0.3);
      margin: var(--space-xs) 0;
    }

    /* Info Panel */
    .info-panel {
      position: absolute;
      bottom: var(--space-lg);
      left: var(--space-lg);
      background: var(--bg-panel);
      border: 1px solid var(--neon-cyan);
      border-radius: 4px;
      padding: var(--space-md);
      font-size: 0.7rem;
      z-index: 1000;
      min-width: 200px;
    }
    .info-panel-title {
      font-family: var(--font-display);
      font-size: 0.6rem;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      margin-bottom: var(--space-sm);
      text-transform: uppercase;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: var(--space-xs) 0;
      border-bottom: 1px solid rgba(0, 245, 255, 0.1);
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: var(--text-dim); }
    .info-value { color: var(--neon-green); }

    /* ========== TOAST NOTIFICATIONS ========== */
    .toast-container {
      position: fixed;
      top: calc(var(--header-height) + var(--space-md));
      right: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      z-index: 9999;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md) var(--space-lg);
      background: var(--bg-panel-solid);
      border: 1px solid var(--neon-cyan);
      border-radius: 4px;
      box-shadow: var(--border-glow);
      animation: slideInRight 0.3s ease;
      max-width: 350px;
      font-size: 0.8rem;
    }
    .toast.success { border-color: var(--neon-green); }
    .toast.error { border-color: var(--neon-red); }
    .toast.info { border-color: var(--neon-cyan); }
    .toast.warning { border-color: var(--neon-orange); }
    .toast-icon { font-size: 1.2rem; }
    .toast.success .toast-icon { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
    .toast.error .toast-icon { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); }
    .toast.info .toast-icon { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }
    .toast.warning .toast-icon { color: var(--neon-orange); text-shadow: 0 0 10px var(--neon-orange); }
    .toast-content { flex: 1; }
    .toast-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: var(--space-xs);
    }
    .toast-message { color: var(--text-secondary); font-size: 0.75rem; }
    .toast-close {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: var(--space-xs);
    }
    .toast-close:hover { color: var(--neon-cyan); }

    /* ========== LOADING OVERLAY ========== */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 8, 16, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-lg);
      z-index: 99999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .loading-overlay.active { opacity: 1; visibility: visible; }
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(0, 245, 255, 0.2);
      border-top-color: var(--neon-cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 20px var(--neon-cyan);
    }
    .loading-text {
      font-family: var(--font-display);
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--neon-cyan);
      animation: blink 1s ease-in-out infinite;
    }

    /* ========== LEAFLET CUSTOM ========== */
    .leaflet-container { font-family: var(--font-mono); background: var(--bg-space); }
    .leaflet-control-attribution {
      background: var(--bg-panel) !important;
      color: var(--text-dim) !important;
      font-size: 0.6rem !important;
      border-top: 1px solid rgba(0, 245, 255, 0.3) !important;
      border-left: 1px solid rgba(0, 245, 255, 0.3) !important;
    }
    .leaflet-control-attribution a { color: var(--neon-cyan) !important; }
    .leaflet-popup-content-wrapper {
      background: var(--bg-panel-solid);
      border: 1px solid var(--neon-cyan);
      border-radius: 4px;
      box-shadow: var(--border-glow);
    }
    .leaflet-popup-content {
      margin: var(--space-md);
      color: var(--text-primary);
      font-size: 0.8rem;
    }
    .leaflet-popup-tip { background: var(--bg-panel-solid); border: 1px solid var(--neon-cyan); }
    .leaflet-control-zoom { display: none !important; }
    .leaflet-control-scale-line {
      background: var(--bg-panel) !important;
      border-color: var(--neon-cyan) !important;
      color: var(--text-primary) !important;
      font-size: 0.65rem !important;
    }

    /* ========== ANIMATIONS ========== */
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes scan {
      0% { top: 0; }
      100% { top: 100%; }
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(100%); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 1024px) {
      .sidebar {
        position: absolute;
        left: 0;
        top: var(--header-height);
        height: calc(100vh - var(--header-height));
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .menu-toggle { display: flex; }
      .header-center { display: none; }
      .status-indicator { display: none; }
    }

    @media (max-width: 768px) {
      :root { --sidebar-width: 100%; --header-height: 60px; }
      .logo span { display: none; }
      .map-controls { top: var(--space-md); right: var(--space-md); }
      .info-panel { display: none; }
    }

    /* ========== SCROLLBAR ========== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-space); }
    ::-webkit-scrollbar-thumb {
      background: var(--neon-cyan);
      border-radius: 3px;
      box-shadow: 0 0 5px var(--neon-cyan);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header / Command Bar -->
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
          <i class="fas fa-bars"></i>
        </button>
        <div class="logo">
          <i class="fas fa-satellite"></i>
          <span>Command Center</span>
        </div>
      </div>
      <div class="header-center">
        <div class="search-container">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Target coordinates..." autocomplete="off">
          <div class="search-results" id="searchResults"></div>
        </div>
      </div>
      <div class="header-right">
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span>Online</span>
        </div>
        <button class="icon-btn" id="fullscreenToggle" aria-label="Toggle fullscreen">
          <i class="fas fa-expand"></i>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Sidebar / Control Panel -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
          <!-- Layers Section -->
          <section class="sidebar-section">
            <div class="section-header">
              <i class="fas fa-layer-group"></i>
              <span>Map Layers</span>
            </div>
            <div class="section-content">
              <div class="layer-list" id="baseLayers">
                <label class="layer-item">
                  <input type="radio" name="baseLayer" value="osm" checked>
                  <span class="layer-radio"></span>
                  <span class="layer-name">Standard View</span>
                </label>
                <label class="layer-item">
                  <input type="radio" name="baseLayer" value="satellite">
                  <span class="layer-radio"></span>
                  <span class="layer-name">Satellite Feed</span>
                </label>
                <label class="layer-item">
                  <input type="radio" name="baseLayer" value="terrain">
                  <span class="layer-radio"></span>
                  <span class="layer-name">Terrain Scan</span>
                </label>
                <label class="layer-item">
                  <input type="radio" name="baseLayer" value="dark">
                  <span class="layer-radio"></span>
                  <span class="layer-name">Night Vision</span>
                </label>
              </div>
            </div>
          </section>

          <!-- Tools Section -->
          <section class="sidebar-section">
            <div class="section-header">
              <i class="fas fa-tools"></i>
              <span>Tools</span>
            </div>
            <div class="section-content">
              <div class="tools-grid">
                <button class="tool-btn" id="drawMarker" title="Drop Marker">
                  <i class="fas fa-map-marker-alt"></i>
                </button>
                <button class="tool-btn" id="drawLine" title="Draw Line">
                  <i class="fas fa-grip-lines"></i>
                </button>
                <button class="tool-btn" id="drawPolygon" title="Draw Polygon">
                  <i class="fas fa-draw-polygon"></i>
                </button>
                <button class="tool-btn" id="drawCircle" title="Draw Circle">
                  <i class="far fa-circle"></i>
                </button>
                <button class="tool-btn" id="drawRectangle" title="Draw Rectangle">
                  <i class="far fa-square"></i>
                </button>
                <button class="tool-btn" id="measureDistance" title="Measure Distance">
                  <i class="fas fa-ruler"></i>
                </button>
                <button class="tool-btn" id="measureArea" title="Measure Area">
                  <i class="fas fa-vector-square"></i>
                </button>
                <button class="tool-btn danger" id="clearDrawings" title="Clear All">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </div>
            </div>
          </section>

          <!-- Coordinates Section -->
          <section class="sidebar-section">
            <div class="section-header">
              <i class="fas fa-crosshairs"></i>
              <span>Position</span>
            </div>
            <div class="section-content">
              <div class="coordinates-display">
                <div class="coord-item">
                  <span class="coord-label">Latitude</span>
                  <span class="coord-value" id="coordLat">--</span>
                </div>
                <div class="coord-item">
                  <span class="coord-label">Longitude</span>
                  <span class="coord-value" id="coordLng">--</span>
                </div>
              </div>
              <button class="btn-secondary" id="copyCoords">
                <i class="fas fa-copy"></i>
                Copy Coords
              </button>
            </div>
          </section>

          <!-- Export Section -->
          <section class="sidebar-section">
            <div class="section-header">
              <i class="fas fa-download"></i>
              <span>Export Data</span>
            </div>
            <div class="section-content">
              <button class="btn-primary" id="exportGeoJSON">
                <i class="fas fa-file-code"></i>
                Export GeoJSON
              </button>
            </div>
          </section>
        </div>
      </aside>

      <!-- Map Container -->
      <div class="map-wrapper">
        <div class="scan-line"></div>
        <div class="crosshair"></div>
        <div id="map"></div>

        <!-- Map Controls -->
        <div class="map-controls">
          <button class="control-btn" id="zoomIn" aria-label="Zoom in">
            <i class="fas fa-plus"></i>
          </button>
          <button class="control-btn" id="zoomOut" aria-label="Zoom out">
            <i class="fas fa-minus"></i>
          </button>
          <div class="control-divider"></div>
          <button class="control-btn" id="locateBtn" aria-label="My location">
            <i class="fas fa-location-arrow"></i>
          </button>
          <button class="control-btn" id="homeBtn" aria-label="Home">
            <i class="fas fa-home"></i>
          </button>
        </div>

        <!-- Info Panel -->
        <div class="info-panel">
          <div class="info-panel-title">Mission Status</div>
          <div class="info-row">
            <span class="info-label">Zoom Level</span>
            <span class="info-value" id="zoomLevel">6</span>
          </div>
          <div class="info-row">
            <span class="info-label">Objects</span>
            <span class="info-value" id="objectCount">0</span>
          </div>
          <div class="info-row">
            <span class="info-label">System</span>
            <span class="info-value">Nominal</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <span class="loading-text">Initializing Systems...</span>
    </div>
  </div>

  <script>
    // Configuration
    const CONFIG = {
      defaultCenter: [40.416775, -3.703790],
      defaultZoom: 6,
      minZoom: 2,
      maxZoom: 19,
      baseLayers: {
        osm: {
          name: 'Standard View',
          url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
          attribution: '&copy; OpenStreetMap'
        },
        satellite: {
          name: 'Satellite Feed',
          url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
          attribution: '&copy; Esri'
        },
        terrain: {
          name: 'Terrain Scan',
          url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
          attribution: '&copy; OpenTopoMap'
        },
        dark: {
          name: 'Night Vision',
          url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
          attribution: '&copy; CARTO'
        }
      }
    };

    // State
    const state = {
      map: null,
      currentBaseLayer: null,
      baseLayers: {},
      drawnItems: null,
      currentDrawTool: null,
      sidebarOpen: true
    };

    // Initialize
    document.addEventListener('DOMContentLoaded', init);

    function init() {
      initMap();
      initBaseLayers();
      initDrawLayer();
      initEventListeners();
      initCoordinates();
      hideLoading();
      showToast('success', 'Systems Online', 'Command Center initialized successfully');
    }

    // Map
    function initMap() {
      state.map = L.map('map', {
        center: CONFIG.defaultCenter,
        zoom: CONFIG.defaultZoom,
        minZoom: CONFIG.minZoom,
        maxZoom: CONFIG.maxZoom,
        zoomControl: false
      });

      L.control.scale({ position: 'bottomright', metric: true, imperial: false }).addTo(state.map);

      // Update zoom level display
      state.map.on('zoomend', () => {
        document.getElementById('zoomLevel').textContent = state.map.getZoom();
      });
    }

    // Base Layers
    function initBaseLayers() {
      Object.entries(CONFIG.baseLayers).forEach(([key, config]) => {
        state.baseLayers[key] = L.tileLayer(config.url, {
          attribution: config.attribution,
          maxZoom: CONFIG.maxZoom
        });
      });

      state.baseLayers.osm.addTo(state.map);
      state.currentBaseLayer = 'osm';

      document.querySelectorAll('input[name="baseLayer"]').forEach(input => {
        input.addEventListener('change', (e) => switchBaseLayer(e.target.value));
      });
    }

    function switchBaseLayer(layerKey) {
      if (state.currentBaseLayer === layerKey) return;
      if (state.baseLayers[state.currentBaseLayer]) {
        state.map.removeLayer(state.baseLayers[state.currentBaseLayer]);
      }
      state.baseLayers[layerKey].addTo(state.map);
      state.currentBaseLayer = layerKey;
      showToast('info', 'Layer Changed', CONFIG.baseLayers[layerKey].name + ' activated');
    }

    // Drawing
    function initDrawLayer() {
      state.drawnItems = new L.FeatureGroup();
      state.map.addLayer(state.drawnItems);

      state.map.on(L.Draw.Event.CREATED, (e) => {
        const layer = e.layer;

        if (e.layerType === 'marker') {
          const latlng = layer.getLatLng();
          layer.bindPopup('<strong>MARKER</strong><br>LAT: ' + latlng.lat.toFixed(6) + '<br>LNG: ' + latlng.lng.toFixed(6));
        } else if (e.layerType === 'polyline') {
          const distance = calculateDistance(layer);
          layer.bindPopup('<strong>LINE</strong><br>Distance: ' + formatDistance(distance));
        } else if (e.layerType === 'polygon' || e.layerType === 'rectangle') {
          const area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
          layer.bindPopup('<strong>' + e.layerType.toUpperCase() + '</strong><br>Area: ' + formatArea(area));
        } else if (e.layerType === 'circle') {
          const radius = layer.getRadius();
          const area = Math.PI * radius * radius;
          layer.bindPopup('<strong>CIRCLE</strong><br>Radius: ' + formatDistance(radius) + '<br>Area: ' + formatArea(area));
        }

        state.drawnItems.addLayer(layer);
        updateObjectCount();
        showToast('success', 'Object Created', e.layerType.toUpperCase() + ' added to map');
      });
    }

    function updateObjectCount() {
      document.getElementById('objectCount').textContent = state.drawnItems.getLayers().length;
    }

    function startDrawing(type) {
      if (state.currentDrawTool) state.currentDrawTool.disable();

      let handler;
      const opts = { color: '#00f5ff', fillColor: '#00f5ff', fillOpacity: 0.2, weight: 2 };

      switch (type) {
        case 'marker': handler = new L.Draw.Marker(state.map); break;
        case 'polyline': handler = new L.Draw.Polyline(state.map, { shapeOptions: opts }); break;
        case 'polygon': handler = new L.Draw.Polygon(state.map, { shapeOptions: opts }); break;
        case 'circle': handler = new L.Draw.Circle(state.map, { shapeOptions: opts }); break;
        case 'rectangle': handler = new L.Draw.Rectangle(state.map, { shapeOptions: opts }); break;
      }

      if (handler) {
        handler.enable();
        state.currentDrawTool = handler;
        updateToolButtons(type);
      }
    }

    function updateToolButtons(activeType) {
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
      const map = { marker: 'drawMarker', polyline: 'drawLine', polygon: 'drawPolygon', circle: 'drawCircle', rectangle: 'drawRectangle' };
      if (map[activeType]) document.getElementById(map[activeType])?.classList.add('active');
    }

    function clearDrawings() {
      state.drawnItems.clearLayers();
      updateObjectCount();
      showToast('info', 'Map Cleared', 'All objects removed');
    }

    // Measurements
    function calculateDistance(layer) {
      const latlngs = layer.getLatLngs();
      let distance = 0;
      for (let i = 0; i < latlngs.length - 1; i++) {
        distance += latlngs[i].distanceTo(latlngs[i + 1]);
      }
      return distance;
    }

    function formatDistance(meters) {
      return meters >= 1000 ? (meters / 1000).toFixed(2) + ' km' : meters.toFixed(2) + ' m';
    }

    function formatArea(sqMeters) {
      if (sqMeters >= 1000000) return (sqMeters / 1000000).toFixed(2) + ' km²';
      if (sqMeters >= 10000) return (sqMeters / 10000).toFixed(2) + ' ha';
      return sqMeters.toFixed(2) + ' m²';
    }

    // Coordinates
    function initCoordinates() {
      state.map.on('mousemove', (e) => {
        document.getElementById('coordLat').textContent = e.latlng.lat.toFixed(6);
        document.getElementById('coordLng').textContent = e.latlng.lng.toFixed(6);
      });
    }

    function copyCoordinates() {
      const lat = document.getElementById('coordLat').textContent;
      const lng = document.getElementById('coordLng').textContent;
      if (lat === '--') {
        showToast('warning', 'No Target', 'Move cursor over map first');
        return;
      }
      navigator.clipboard.writeText(lat + ', ' + lng).then(() => {
        showToast('success', 'Copied', 'Coordinates copied to clipboard');
      });
    }

    // Geolocation
    function locateUser() {
      showLoading();
      state.map.locate({ setView: true, maxZoom: 16 });

      state.map.once('locationfound', (e) => {
        hideLoading();
        L.marker(e.latlng).addTo(state.drawnItems)
          .bindPopup('<strong>YOUR POSITION</strong><br>Accuracy: ' + formatDistance(e.accuracy)).openPopup();
        L.circle(e.latlng, { radius: e.accuracy, color: '#00f5ff', fillOpacity: 0.1 }).addTo(state.drawnItems);
        updateObjectCount();
        showToast('success', 'Position Acquired', 'Your location has been identified');
      });

      state.map.once('locationerror', (e) => {
        hideLoading();
        showToast('error', 'Location Error', e.message);
      });
    }

    // Search
    let searchTimeout;
    async function searchLocation(query) {
      if (!query || query.length < 3) {
        hideSearchResults();
        return;
      }
      try {
        const response = await fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query) + '&limit=5');
        const results = await response.json();
        if (results.length > 0) showSearchResults(results);
        else hideSearchResults();
      } catch (error) {
        showToast('error', 'Search Error', 'Unable to complete search');
      }
    }

    function showSearchResults(results) {
      const container = document.getElementById('searchResults');
      container.innerHTML = results.map(r =>
        '<div class="search-result-item" data-lat="' + r.lat + '" data-lon="' + r.lon + '">' +
        '<i class="fas fa-crosshairs" style="color:var(--neon-cyan);margin-right:8px"></i>' + r.display_name + '</div>'
      ).join('');
      container.classList.add('active');

      container.querySelectorAll('.search-result-item').forEach(item => {
        item.addEventListener('click', () => {
          state.map.setView([parseFloat(item.dataset.lat), parseFloat(item.dataset.lon)], 15);
          L.marker([parseFloat(item.dataset.lat), parseFloat(item.dataset.lon)])
            .addTo(state.drawnItems).bindPopup(item.textContent.trim()).openPopup();
          updateObjectCount();
          hideSearchResults();
          document.getElementById('searchInput').value = '';
        });
      });
    }

    function hideSearchResults() {
      document.getElementById('searchResults').classList.remove('active');
    }

    // Export
    function exportGeoJSON() {
      const data = state.drawnItems.toGeoJSON();
      if (data.features.length === 0) {
        showToast('warning', 'No Data', 'No objects to export');
        return;
      }
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'mission-data-' + new Date().toISOString().slice(0, 10) + '.geojson';
      a.click();
      showToast('success', 'Data Exported', 'GeoJSON file downloaded');
    }

    // UI
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }

    // Toast
    function showToast(type, title, message) {
      const container = document.getElementById('toastContainer');
      const icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
      const toast = document.createElement('div');
      toast.className = 'toast ' + type;
      toast.innerHTML = '<i class="fas ' + icons[type] + ' toast-icon"></i>' +
        '<div class="toast-content"><div class="toast-title">' + title + '</div><div class="toast-message">' + message + '</div></div>' +
        '<button class="toast-close"><i class="fas fa-times"></i></button>';
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 5000);
      toast.querySelector('.toast-close').addEventListener('click', () => toast.remove());
    }

    // Loading
    function showLoading() { document.getElementById('loadingOverlay').classList.add('active'); }
    function hideLoading() { document.getElementById('loadingOverlay').classList.remove('active'); }

    // Event Listeners
    function initEventListeners() {
      document.getElementById('fullscreenToggle')?.addEventListener('click', toggleFullscreen);
      document.getElementById('menuToggle')?.addEventListener('click', toggleSidebar);
      document.getElementById('zoomIn')?.addEventListener('click', () => state.map.zoomIn());
      document.getElementById('zoomOut')?.addEventListener('click', () => state.map.zoomOut());
      document.getElementById('homeBtn')?.addEventListener('click', () => state.map.setView(CONFIG.defaultCenter, CONFIG.defaultZoom));
      document.getElementById('locateBtn')?.addEventListener('click', locateUser);
      document.getElementById('drawMarker')?.addEventListener('click', () => startDrawing('marker'));
      document.getElementById('drawLine')?.addEventListener('click', () => startDrawing('polyline'));
      document.getElementById('drawPolygon')?.addEventListener('click', () => startDrawing('polygon'));
      document.getElementById('drawCircle')?.addEventListener('click', () => startDrawing('circle'));
      document.getElementById('drawRectangle')?.addEventListener('click', () => startDrawing('rectangle'));
      document.getElementById('measureDistance')?.addEventListener('click', () => { startDrawing('polyline'); showToast('info', 'Measure', 'Draw a line to measure'); });
      document.getElementById('measureArea')?.addEventListener('click', () => { startDrawing('polygon'); showToast('info', 'Measure', 'Draw a polygon to measure'); });
      document.getElementById('clearDrawings')?.addEventListener('click', clearDrawings);
      document.getElementById('copyCoords')?.addEventListener('click', copyCoordinates);
      document.getElementById('exportGeoJSON')?.addEventListener('click', exportGeoJSON);

      const searchInput = document.getElementById('searchInput');
      searchInput?.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => searchLocation(e.target.value), 500);
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-container')) hideSearchResults();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && state.currentDrawTool) {
          state.currentDrawTool.disable();
          state.currentDrawTool = null;
          updateToolButtons(null);
        }
      });

      window.addEventListener('resize', () => state.map.invalidateSize());
    }
  </script>
</body>
</html>
