<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Visor GIS moderno con Leaflet">
  <meta name="theme-color" content="#667eea">
  <title>GIS Viewer - Leaflet</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

  <style>
    /* ==========================================================================
       GIS Viewer - Modern CSS with Latest Design Trends
       ========================================================================== */

    :root {
      --color-primary: #667eea;
      --color-primary-dark: #5a67d8;
      --color-primary-light: #818cf8;
      --color-secondary: #764ba2;
      --color-accent: #f093fb;
      --color-success: #10b981;
      --color-warning: #f59e0b;
      --color-danger: #ef4444;
      --color-info: #3b82f6;
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #f1f5f9;
      --bg-glass: rgba(255, 255, 255, 0.7);
      --bg-glass-darker: rgba(255, 255, 255, 0.85);
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      --text-inverse: #ffffff;
      --border-color: rgba(0, 0, 0, 0.08);
      --border-color-strong: rgba(0, 0, 0, 0.15);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.1);
      --glass-blur: blur(20px);
      --glass-border: 1px solid rgba(255, 255, 255, 0.3);
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-2xl: 1.5rem;
      --radius-full: 9999px;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-md: 1rem;
      --font-size-lg: 1.125rem;
      --transition-fast: 150ms ease;
      --transition-normal: 250ms ease;
      --header-height: 64px;
      --sidebar-width: 320px;
    }

    [data-theme="dark"] {
      --color-primary: #818cf8;
      --color-primary-dark: #6366f1;
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --bg-glass: rgba(30, 41, 59, 0.8);
      --bg-glass-darker: rgba(30, 41, 59, 0.95);
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-tertiary: #64748b;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-color-strong: rgba(255, 255, 255, 0.15);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      --glass-border: 1px solid rgba(255, 255, 255, 0.1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-family);
      font-size: var(--font-size-md);
      line-height: 1.5;
      color: var(--text-primary);
      background: var(--bg-primary);
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--header-height);
      padding: 0 var(--space-lg);
      background: var(--bg-glass);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: var(--glass-border);
      box-shadow: var(--shadow-md);
      z-index: 1000;
    }
    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }
    .header-center {
      flex: 1;
      max-width: 500px;
      margin: 0 var(--space-xl);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: var(--font-size-lg);
      font-weight: 600;
      color: var(--color-primary);
    }
    .logo i { font-size: 1.5rem; }
    .menu-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .menu-toggle:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    /* Search */
    .search-container {
      position: relative;
      width: 100%;
    }
    .search-container i {
      position: absolute;
      left: var(--space-md);
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      font-size: var(--font-size-sm);
    }
    .search-container input {
      width: 100%;
      padding: var(--space-sm) var(--space-md);
      padding-left: 2.5rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-family: inherit;
      font-size: var(--font-size-sm);
      transition: all var(--transition-fast);
    }
    .search-container input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }
    .search-container input::placeholder { color: var(--text-tertiary); }
    .search-results {
      position: absolute;
      top: calc(100% + var(--space-sm));
      left: 0;
      right: 0;
      background: var(--bg-glass-darker);
      backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      max-height: 300px;
      overflow-y: auto;
      display: none;
      z-index: 100;
    }
    .search-results.active {
      display: block;
      animation: slideDown var(--transition-normal);
    }
    .search-result-item {
      padding: var(--space-md);
      cursor: pointer;
      transition: background var(--transition-fast);
      border-bottom: 1px solid var(--border-color);
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: var(--bg-tertiary); }

    /* Icon Buttons */
    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .icon-btn:hover {
      background: var(--bg-tertiary);
      color: var(--color-primary);
      transform: scale(1.05);
    }
    .icon-btn:active { transform: scale(0.95); }

    /* Main Content */
    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-glass);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-right: var(--glass-border);
      overflow-y: auto;
      transition: transform var(--transition-normal);
      z-index: 100;
    }
    .sidebar-content {
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
    }
    .sidebar-section {
      background: var(--bg-glass-darker);
      border-radius: var(--radius-xl);
      border: var(--glass-border);
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-lg);
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
      color: var(--text-inverse);
      font-weight: 600;
      font-size: var(--font-size-sm);
    }
    .section-header i { font-size: var(--font-size-md); }
    .section-content {
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    /* Layer List */
    .layer-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }
    .layer-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    .layer-item:hover { background: var(--bg-tertiary); }
    .layer-item input { display: none; }
    .layer-radio {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border-color-strong);
      border-radius: var(--radius-full);
      position: relative;
      transition: all var(--transition-fast);
    }
    .layer-item input:checked + .layer-radio { border-color: var(--color-primary); }
    .layer-item input:checked + .layer-radio::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      background: var(--color-primary);
      border-radius: var(--radius-full);
    }
    .layer-name {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
    }

    /* Tools Grid */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-sm);
    }
    .tool-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative;
    }
    .tool-btn:hover {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: var(--text-inverse);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .tool-btn:active { transform: translateY(0); }
    .tool-btn.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: var(--text-inverse);
    }
    .tool-btn.danger:hover {
      background: var(--color-danger);
      border-color: var(--color-danger);
    }

    /* Coordinates */
    .coordinates-display {
      display: flex;
      gap: var(--space-md);
      padding: var(--space-sm);
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: var(--font-size-sm);
    }
    .coord-item { display: flex; gap: var(--space-xs); }
    .coord-label { color: var(--text-tertiary); }
    .coord-value { color: var(--color-primary); font-weight: 500; }

    /* Buttons */
    .btn-primary, .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      border: none;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: var(--font-size-sm);
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
      color: var(--text-inverse);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    /* Map Container */
    .map-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
      background: var(--bg-secondary);
    }

    /* Map Controls */
    .map-controls {
      position: absolute;
      top: var(--space-lg);
      right: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      background: var(--bg-glass);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      border-radius: var(--radius-xl);
      padding: var(--space-sm);
      box-shadow: var(--shadow-lg);
      z-index: 1000;
    }
    .control-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .control-btn:hover {
      background: var(--bg-tertiary);
      color: var(--color-primary);
    }
    .control-btn:active { transform: scale(0.9); }
    .control-divider {
      height: 1px;
      background: var(--border-color);
      margin: var(--space-xs) 0;
    }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      bottom: var(--space-xl);
      right: var(--space-xl);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      z-index: 9999;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md) var(--space-lg);
      background: var(--bg-glass-darker);
      backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      animation: slideInRight var(--transition-normal);
      max-width: 350px;
    }
    .toast.success { border-left: 4px solid var(--color-success); }
    .toast.error { border-left: 4px solid var(--color-danger); }
    .toast.info { border-left: 4px solid var(--color-info); }
    .toast.warning { border-left: 4px solid var(--color-warning); }
    .toast-icon { font-size: var(--font-size-lg); }
    .toast.success .toast-icon { color: var(--color-success); }
    .toast.error .toast-icon { color: var(--color-danger); }
    .toast.info .toast-icon { color: var(--color-info); }
    .toast.warning .toast-icon { color: var(--color-warning); }
    .toast-content { flex: 1; }
    .toast-title {
      font-weight: 600;
      font-size: var(--font-size-sm);
      margin-bottom: var(--space-xs);
    }
    .toast-message {
      font-size: var(--font-size-xs);
      color: var(--text-secondary);
    }
    .toast-close {
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      padding: var(--space-xs);
    }
    .toast-close:hover { color: var(--text-primary); }

    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-glass);
      backdrop-filter: var(--glass-blur);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-md);
      z-index: 99999;
      opacity: 0;
      visibility: hidden;
      transition: all var(--transition-normal);
    }
    .loading-overlay.active { opacity: 1; visibility: visible; }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border-color);
      border-top-color: var(--color-primary);
      border-radius: var(--radius-full);
      animation: spin 1s linear infinite;
    }

    /* Leaflet Custom */
    .leaflet-container { font-family: var(--font-family); }
    .leaflet-control-attribution {
      background: var(--bg-glass) !important;
      backdrop-filter: var(--glass-blur);
      font-size: var(--font-size-xs) !important;
    }
    .leaflet-popup-content-wrapper {
      background: var(--bg-glass-darker);
      backdrop-filter: var(--glass-blur);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      border: var(--glass-border);
    }
    .leaflet-popup-content {
      margin: var(--space-md);
      color: var(--text-primary);
      font-size: var(--font-size-sm);
    }
    .leaflet-popup-tip { background: var(--bg-glass-darker); }
    .leaflet-control-zoom { display: none !important; }

    /* Animations */
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(100%); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 1024px) {
      .sidebar {
        position: absolute;
        left: 0;
        top: var(--header-height);
        height: calc(100vh - var(--header-height));
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .menu-toggle { display: flex; }
      .header-center { display: none; }
    }

    @media (max-width: 768px) {
      :root { --sidebar-width: 100%; --header-height: 56px; }
      .header { padding: 0 var(--space-md); }
      .logo span { display: none; }
      .map-controls { top: var(--space-md); right: var(--space-md); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color-strong);
      border-radius: var(--radius-full);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
          <i class="fas fa-bars"></i>
        </button>
        <div class="logo">
          <i class="fas fa-globe-americas"></i>
          <span>GIS Viewer</span>
        </div>
      </div>
      <div class="header-center">
        <div class="search-container">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Buscar ubicación..." autocomplete="off">
          <div class="search-results" id="searchResults"></div>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
          <i class="fas fa-moon"></i>
        </button>
        <button class="icon-btn" id="fullscreenToggle" aria-label="Toggle fullscreen">
          <i class="fas fa-expand"></i>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
          <!-- Layers Section -->
          <section class="sidebar-section">
            <div class="section-header">
              <i class="fas fa-layer-group"></i>
              <span>Capas Base</span>
            </div>
            <div class="section-content">
              <div class="layer-list" id="baseLayers">
                <label class="layer-item">
                  <input type="radio" name="baseLayer" value="osm" checked>
                  <span class="layer-radio"></span>
                  <span class="layer-name">OpenStreetMap</span>
                </label>
                <label class="layer-item">
                  <input type="radio" name="baseLayer" value="satellite">
                  <span class="layer-radio"></span>
                  <span class="layer-name">Satélite</span>
                </label>
                <label class="layer-item">
                  <input type="radio" name="baseLayer" value="terrain">
                  <span class="layer-radio"></span>
                  <span class="layer-name">Terreno</span>
                </label>
                <label class="layer-item">
                  <input type="radio" name="baseLayer" value="dark">
                  <span class="layer-radio"></span>
                  <span class="layer-name">Oscuro</span>
                </label>
              </div>
            </div>
          </section>

          <!-- Tools Section -->
          <section class="sidebar-section">
            <div class="section-header">
              <i class="fas fa-tools"></i>
              <span>Herramientas</span>
            </div>
            <div class="section-content">
              <div class="tools-grid">
                <button class="tool-btn" id="drawMarker" title="Marcador">
                  <i class="fas fa-map-marker-alt"></i>
                </button>
                <button class="tool-btn" id="drawLine" title="Línea">
                  <i class="fas fa-grip-lines"></i>
                </button>
                <button class="tool-btn" id="drawPolygon" title="Polígono">
                  <i class="fas fa-draw-polygon"></i>
                </button>
                <button class="tool-btn" id="drawCircle" title="Círculo">
                  <i class="far fa-circle"></i>
                </button>
                <button class="tool-btn" id="drawRectangle" title="Rectángulo">
                  <i class="far fa-square"></i>
                </button>
                <button class="tool-btn" id="measureDistance" title="Medir distancia">
                  <i class="fas fa-ruler"></i>
                </button>
                <button class="tool-btn" id="measureArea" title="Medir área">
                  <i class="fas fa-vector-square"></i>
                </button>
                <button class="tool-btn danger" id="clearDrawings" title="Limpiar">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </div>
            </div>
          </section>

          <!-- Coordinates Section -->
          <section class="sidebar-section">
            <div class="section-header">
              <i class="fas fa-crosshairs"></i>
              <span>Coordenadas</span>
            </div>
            <div class="section-content">
              <div class="coordinates-display">
                <div class="coord-item">
                  <span class="coord-label">Lat:</span>
                  <span class="coord-value" id="coordLat">--</span>
                </div>
                <div class="coord-item">
                  <span class="coord-label">Lng:</span>
                  <span class="coord-value" id="coordLng">--</span>
                </div>
              </div>
              <button class="btn-secondary" id="copyCoords">
                <i class="fas fa-copy"></i>
                Copiar coordenadas
              </button>
            </div>
          </section>

          <!-- Export Section -->
          <section class="sidebar-section">
            <div class="section-header">
              <i class="fas fa-download"></i>
              <span>Exportar</span>
            </div>
            <div class="section-content">
              <button class="btn-primary" id="exportGeoJSON">
                <i class="fas fa-file-code"></i>
                Exportar GeoJSON
              </button>
            </div>
          </section>
        </div>
      </aside>

      <!-- Map Container -->
      <div class="map-wrapper">
        <div id="map"></div>

        <!-- Map Controls -->
        <div class="map-controls">
          <button class="control-btn" id="zoomIn" aria-label="Zoom in">
            <i class="fas fa-plus"></i>
          </button>
          <button class="control-btn" id="zoomOut" aria-label="Zoom out">
            <i class="fas fa-minus"></i>
          </button>
          <div class="control-divider"></div>
          <button class="control-btn" id="locateBtn" aria-label="My location">
            <i class="fas fa-location-arrow"></i>
          </button>
          <button class="control-btn" id="homeBtn" aria-label="Home">
            <i class="fas fa-home"></i>
          </button>
        </div>
      </div>
    </main>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <span>Cargando...</span>
    </div>
  </div>

  <script>
    // Configuration
    const CONFIG = {
      defaultCenter: [40.416775, -3.703790],
      defaultZoom: 6,
      minZoom: 2,
      maxZoom: 19,
      baseLayers: {
        osm: {
          name: 'OpenStreetMap',
          url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
          attribution: '&copy; OpenStreetMap contributors'
        },
        satellite: {
          name: 'Satélite',
          url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
          attribution: '&copy; Esri'
        },
        terrain: {
          name: 'Terreno',
          url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
          attribution: '&copy; OpenTopoMap'
        },
        dark: {
          name: 'Oscuro',
          url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
          attribution: '&copy; CARTO'
        }
      }
    };

    // State
    const state = {
      map: null,
      currentBaseLayer: null,
      baseLayers: {},
      drawnItems: null,
      currentDrawTool: null,
      theme: localStorage.getItem('gis-theme') || 'light',
      sidebarOpen: true
    };

    // Initialize
    document.addEventListener('DOMContentLoaded', init);

    function init() {
      initTheme();
      initMap();
      initBaseLayers();
      initDrawLayer();
      initEventListeners();
      initCoordinates();
      hideLoading();
      showToast('success', 'Bienvenido', 'Visor GIS cargado correctamente');
    }

    // Theme
    function initTheme() {
      document.documentElement.setAttribute('data-theme', state.theme);
      updateThemeIcon();
    }

    function toggleTheme() {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', state.theme);
      localStorage.setItem('gis-theme', state.theme);
      updateThemeIcon();
    }

    function updateThemeIcon() {
      const icon = document.querySelector('#themeToggle i');
      if (icon) icon.className = state.theme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
    }

    // Map
    function initMap() {
      state.map = L.map('map', {
        center: CONFIG.defaultCenter,
        zoom: CONFIG.defaultZoom,
        minZoom: CONFIG.minZoom,
        maxZoom: CONFIG.maxZoom,
        zoomControl: false
      });

      L.control.scale({ position: 'bottomleft', metric: true, imperial: false }).addTo(state.map);
    }

    // Base Layers
    function initBaseLayers() {
      Object.entries(CONFIG.baseLayers).forEach(([key, config]) => {
        state.baseLayers[key] = L.tileLayer(config.url, {
          attribution: config.attribution,
          maxZoom: CONFIG.maxZoom
        });
      });

      state.baseLayers.osm.addTo(state.map);
      state.currentBaseLayer = 'osm';

      document.querySelectorAll('input[name="baseLayer"]').forEach(input => {
        input.addEventListener('change', (e) => switchBaseLayer(e.target.value));
      });
    }

    function switchBaseLayer(layerKey) {
      if (state.currentBaseLayer === layerKey) return;
      if (state.baseLayers[state.currentBaseLayer]) {
        state.map.removeLayer(state.baseLayers[state.currentBaseLayer]);
      }
      state.baseLayers[layerKey].addTo(state.map);
      state.currentBaseLayer = layerKey;
      showToast('info', 'Capa cambiada', CONFIG.baseLayers[layerKey].name + ' activada');
    }

    // Drawing
    function initDrawLayer() {
      state.drawnItems = new L.FeatureGroup();
      state.map.addLayer(state.drawnItems);

      state.map.on(L.Draw.Event.CREATED, (e) => {
        const layer = e.layer;

        if (e.layerType === 'marker') {
          const latlng = layer.getLatLng();
          layer.bindPopup('<strong>Marcador</strong><br>Lat: ' + latlng.lat.toFixed(6) + '<br>Lng: ' + latlng.lng.toFixed(6));
        } else if (e.layerType === 'polyline') {
          const distance = calculateDistance(layer);
          layer.bindPopup('<strong>Línea</strong><br>Distancia: ' + formatDistance(distance));
        } else if (e.layerType === 'polygon' || e.layerType === 'rectangle') {
          const area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
          layer.bindPopup('<strong>' + (e.layerType === 'polygon' ? 'Polígono' : 'Rectángulo') + '</strong><br>Área: ' + formatArea(area));
        } else if (e.layerType === 'circle') {
          const radius = layer.getRadius();
          const area = Math.PI * radius * radius;
          layer.bindPopup('<strong>Círculo</strong><br>Radio: ' + formatDistance(radius) + '<br>Área: ' + formatArea(area));
        }

        state.drawnItems.addLayer(layer);
        showToast('success', 'Elemento creado', e.layerType + ' añadido al mapa');
      });
    }

    function startDrawing(type) {
      if (state.currentDrawTool) state.currentDrawTool.disable();

      let handler;
      const opts = { color: '#667eea', fillColor: '#667eea', fillOpacity: 0.3, weight: 3 };

      switch (type) {
        case 'marker': handler = new L.Draw.Marker(state.map); break;
        case 'polyline': handler = new L.Draw.Polyline(state.map, { shapeOptions: opts }); break;
        case 'polygon': handler = new L.Draw.Polygon(state.map, { shapeOptions: opts }); break;
        case 'circle': handler = new L.Draw.Circle(state.map, { shapeOptions: opts }); break;
        case 'rectangle': handler = new L.Draw.Rectangle(state.map, { shapeOptions: opts }); break;
      }

      if (handler) {
        handler.enable();
        state.currentDrawTool = handler;
        updateToolButtons(type);
      }
    }

    function updateToolButtons(activeType) {
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
      const map = { marker: 'drawMarker', polyline: 'drawLine', polygon: 'drawPolygon', circle: 'drawCircle', rectangle: 'drawRectangle' };
      if (map[activeType]) document.getElementById(map[activeType])?.classList.add('active');
    }

    function clearDrawings() {
      state.drawnItems.clearLayers();
      showToast('info', 'Mapa limpiado', 'Todos los dibujos eliminados');
    }

    // Measurements
    function calculateDistance(layer) {
      const latlngs = layer.getLatLngs();
      let distance = 0;
      for (let i = 0; i < latlngs.length - 1; i++) {
        distance += latlngs[i].distanceTo(latlngs[i + 1]);
      }
      return distance;
    }

    function formatDistance(meters) {
      return meters >= 1000 ? (meters / 1000).toFixed(2) + ' km' : meters.toFixed(2) + ' m';
    }

    function formatArea(sqMeters) {
      if (sqMeters >= 1000000) return (sqMeters / 1000000).toFixed(2) + ' km²';
      if (sqMeters >= 10000) return (sqMeters / 10000).toFixed(2) + ' ha';
      return sqMeters.toFixed(2) + ' m²';
    }

    // Coordinates
    function initCoordinates() {
      state.map.on('mousemove', (e) => {
        document.getElementById('coordLat').textContent = e.latlng.lat.toFixed(6);
        document.getElementById('coordLng').textContent = e.latlng.lng.toFixed(6);
      });
    }

    function copyCoordinates() {
      const lat = document.getElementById('coordLat').textContent;
      const lng = document.getElementById('coordLng').textContent;
      if (lat === '--') {
        showToast('warning', 'Sin coordenadas', 'Mueve el cursor sobre el mapa');
        return;
      }
      navigator.clipboard.writeText(lat + ', ' + lng).then(() => {
        showToast('success', 'Copiado', 'Coordenadas copiadas');
      });
    }

    // Geolocation
    function locateUser() {
      showLoading();
      state.map.locate({ setView: true, maxZoom: 16 });

      state.map.once('locationfound', (e) => {
        hideLoading();
        L.marker(e.latlng).addTo(state.drawnItems)
          .bindPopup('<strong>Tu ubicación</strong><br>Precisión: ' + formatDistance(e.accuracy)).openPopup();
        L.circle(e.latlng, { radius: e.accuracy, color: '#667eea', fillOpacity: 0.1 }).addTo(state.drawnItems);
        showToast('success', 'Ubicación encontrada', 'Tu posición ha sido localizada');
      });

      state.map.once('locationerror', (e) => {
        hideLoading();
        showToast('error', 'Error de ubicación', e.message);
      });
    }

    // Search
    let searchTimeout;
    async function searchLocation(query) {
      if (!query || query.length < 3) {
        hideSearchResults();
        return;
      }
      try {
        const response = await fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query) + '&limit=5');
        const results = await response.json();
        if (results.length > 0) showSearchResults(results);
        else hideSearchResults();
      } catch (error) {
        showToast('error', 'Error', 'No se pudo buscar');
      }
    }

    function showSearchResults(results) {
      const container = document.getElementById('searchResults');
      container.innerHTML = results.map(r =>
        '<div class="search-result-item" data-lat="' + r.lat + '" data-lon="' + r.lon + '">' +
        '<i class="fas fa-map-marker-alt" style="color:var(--color-primary);margin-right:8px"></i>' + r.display_name + '</div>'
      ).join('');
      container.classList.add('active');

      container.querySelectorAll('.search-result-item').forEach(item => {
        item.addEventListener('click', () => {
          state.map.setView([parseFloat(item.dataset.lat), parseFloat(item.dataset.lon)], 15);
          L.marker([parseFloat(item.dataset.lat), parseFloat(item.dataset.lon)])
            .addTo(state.drawnItems).bindPopup(item.textContent.trim()).openPopup();
          hideSearchResults();
          document.getElementById('searchInput').value = '';
        });
      });
    }

    function hideSearchResults() {
      document.getElementById('searchResults').classList.remove('active');
    }

    // Export
    function exportGeoJSON() {
      const data = state.drawnItems.toGeoJSON();
      if (data.features.length === 0) {
        showToast('warning', 'Sin datos', 'No hay elementos para exportar');
        return;
      }
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'gis-export-' + new Date().toISOString().slice(0, 10) + '.geojson';
      a.click();
      showToast('success', 'Exportado', 'Archivo GeoJSON descargado');
    }

    // UI
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }

    // Toast
    function showToast(type, title, message) {
      const container = document.getElementById('toastContainer');
      const icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
      const toast = document.createElement('div');
      toast.className = 'toast ' + type;
      toast.innerHTML = '<i class="fas ' + icons[type] + ' toast-icon"></i>' +
        '<div class="toast-content"><div class="toast-title">' + title + '</div><div class="toast-message">' + message + '</div></div>' +
        '<button class="toast-close"><i class="fas fa-times"></i></button>';
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 5000);
      toast.querySelector('.toast-close').addEventListener('click', () => toast.remove());
    }

    // Loading
    function showLoading() { document.getElementById('loadingOverlay').classList.add('active'); }
    function hideLoading() { document.getElementById('loadingOverlay').classList.remove('active'); }

    // Event Listeners
    function initEventListeners() {
      document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
      document.getElementById('fullscreenToggle')?.addEventListener('click', toggleFullscreen);
      document.getElementById('menuToggle')?.addEventListener('click', toggleSidebar);
      document.getElementById('zoomIn')?.addEventListener('click', () => state.map.zoomIn());
      document.getElementById('zoomOut')?.addEventListener('click', () => state.map.zoomOut());
      document.getElementById('homeBtn')?.addEventListener('click', () => state.map.setView(CONFIG.defaultCenter, CONFIG.defaultZoom));
      document.getElementById('locateBtn')?.addEventListener('click', locateUser);
      document.getElementById('drawMarker')?.addEventListener('click', () => startDrawing('marker'));
      document.getElementById('drawLine')?.addEventListener('click', () => startDrawing('polyline'));
      document.getElementById('drawPolygon')?.addEventListener('click', () => startDrawing('polygon'));
      document.getElementById('drawCircle')?.addEventListener('click', () => startDrawing('circle'));
      document.getElementById('drawRectangle')?.addEventListener('click', () => startDrawing('rectangle'));
      document.getElementById('measureDistance')?.addEventListener('click', () => { startDrawing('polyline'); showToast('info', 'Medir', 'Dibuja una línea'); });
      document.getElementById('measureArea')?.addEventListener('click', () => { startDrawing('polygon'); showToast('info', 'Medir', 'Dibuja un polígono'); });
      document.getElementById('clearDrawings')?.addEventListener('click', clearDrawings);
      document.getElementById('copyCoords')?.addEventListener('click', copyCoordinates);
      document.getElementById('exportGeoJSON')?.addEventListener('click', exportGeoJSON);

      const searchInput = document.getElementById('searchInput');
      searchInput?.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => searchLocation(e.target.value), 500);
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-container')) hideSearchResults();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && state.currentDrawTool) {
          state.currentDrawTool.disable();
          state.currentDrawTool = null;
          updateToolButtons(null);
        }
      });

      window.addEventListener('resize', () => state.map.invalidateSize());
    }
  </script>
</body>
</html>
